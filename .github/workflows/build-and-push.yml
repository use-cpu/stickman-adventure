# ============================================================
# Stickman Adventure - 镜像自动构建并推到 Sealos 内置仓库
# ============================================================
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions
# 添加以下 Secrets:
#   SEALOS_REGISTRY   镜像仓库地址(不含路径),如 abc123.cloud.sealos.io
#   SEALOS_USERNAME   镜像仓库用户名(通常同 Sealos 账号)
#   SEALOS_PASSWORD   镜像仓库密码或访问令牌
# 添加完再 push 一次代码,即可触发构建
# ============================================================
name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Sealos registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SEALOS_REGISTRY }}
          username: ${{ secrets.SEALOS_USERNAME }}
          password: ${{ secrets.SEALOS_PASSWORD }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # 镜像路径 = <registry>/<username>/stickman-backend:tag
          tags: |
            ${{ secrets.SEALOS_REGISTRY }}/${{ secrets.SEALOS_USERNAME }}/stickman-backend:latest
            ${{ secrets.SEALOS_REGISTRY }}/${{ secrets.SEALOS_USERNAME }}/stickman-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Sealos registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SEALOS_REGISTRY }}
          username: ${{ secrets.SEALOS_USERNAME }}
          password: ${{ secrets.SEALOS_PASSWORD }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.SEALOS_REGISTRY }}/${{ secrets.SEALOS_USERNAME }}/stickman-frontend:latest
            ${{ secrets.SEALOS_REGISTRY }}/${{ secrets.SEALOS_USERNAME }}/stickman-frontend:${{ github.sha }}
