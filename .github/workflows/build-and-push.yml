# ============================================================
# Stickman Adventure - 镜像自动构建并推到 Docker Hub
# ============================================================
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions
# 添加以下 2 个 Secrets:
#   DOCKERHUB_USERNAME   你的 Docker Hub 用户名,如 usecpu
#   DOCKERHUB_TOKEN      Docker Hub Access Token
#                       (在 hub.docker.com → Account Settings → Security 生成,
#                        只给 Read/Write/Delete 权限即可,别用登录密码)
# 添加完 push 一次代码或手动 Run workflow,即可触发构建并推到:
#   docker.io/<DOCKERHUB_USERNAME>/stickman-backend:latest
#   docker.io/<DOCKERHUB_USERNAME>/stickman-frontend:latest
# ============================================================
name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # 镜像路径 = docker.io/<username>/stickman-backend:tag
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stickman-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stickman-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stickman-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stickman-frontend:${{ github.sha }}
