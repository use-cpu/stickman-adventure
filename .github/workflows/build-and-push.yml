# ============================================================
# Stickman Adventure - 镜像自动构建并推到 GitHub Container Registry
# ============================================================
# 用内置 GITHUB_TOKEN,不需要任何 Secret,不需要 Docker Hub 账号
# 镜像地址:
#   ghcr.io/use-cpu/stickman-backend:latest
#   ghcr.io/use-cpu/stickman-frontend:latest
# 首次 push 后,镜像默认是 private,需要在 GitHub Packages
# 把它改成 public 才能让 Sealos 不带凭证拉取
#   https://github.com/users/use-cpu/packages/container/stickman-backend/settings
#   https://github.com/users/use-cpu/packages/container/stickman-frontend/settings
# ============================================================
name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/use-cpu/stickman-backend:latest
            ghcr.io/use-cpu/stickman-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/use-cpu/stickman-frontend:latest
            ghcr.io/use-cpu/stickman-frontend:${{ github.sha }}
