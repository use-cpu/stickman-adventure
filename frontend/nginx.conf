server {
    listen 80;
    server_name _;
    # Vue 静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由:任何不存在的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反向代理到后端服务
    # 集群内 service 名 "stickman-backend" 在 ns "stickman" 下
    # 如果部署到其他 ns / 改了 service 名,同步修改下方 proxy_pass
    location /api/ {
        proxy_pass http://stickman-backend.stickman.svc.cluster.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
