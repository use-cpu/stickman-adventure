worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 允许 nginx 在运行时动态解析 K8s Service DNS
    # 不用 resolver 指令的话,nginx 只在启动时解析一次 DNS
    # 如果后端 Service 还没起来或 DNS 还没就绪,nginx 会直接崩
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 用变量 + resolver 实现动态 DNS 解析
        # upstream 里的变量让 nginx 每次请求都重新解析,而不是启动时解析一次
        set $backend_upstream "stickman-backend:8080";
        location /api/ {
            proxy_pass http://$backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
