# ============================================================
# 一次性 Job:用 schema.sql 初始化数据库(建库建表 + 内置账号)
# ============================================================
# 用法:
#   1. 先在 Sealos 应用市场部署 MySQL,拿到 host/user/password/dbname
#   2. 编辑下方 env,填入实际值
#   3. kubectl apply -f deploy/init-db-job.yaml
#   4. kubectl logs -n stickman job/init-stickman-db  (看是否成功)
#   5. 成功后可删除 Job: kubectl delete -f deploy/init-db-job.yaml
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: init-stickman-db
  namespace: stickman
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-init
          image: mysql:8
          # 把 db/schema.sql 挂进容器根目录
          # 若 Sealos 上没法挂本地文件,可以改用 ConfigMap,见末尾注释
          command:
            - sh
            - -c
            - |
              set -e
              echo "等待 MySQL 可达..."
              until mysqladmin ping -h"$DB_HOST" --port="$DB_PORT" -u"$DB_USER" -p"$DB_PASSWORD" --silent; do
                echo "  MySQL 还没起来,5 秒后重试..."
                sleep 5
              done
              echo "MySQL 可达,开始执行 schema.sql..."
              mysql -h"$DB_HOST" --port="$DB_PORT" -u"$DB_USER" -p"$DB_PASSWORD" < /schema.sql
              echo "schema.sql 执行完成。"
          env:
            - name: DB_HOST
              value: "stickman-mysql.stickman.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stickman-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: stickman-schema
---
# 把 schema.sql 内容做成 ConfigMap,避免依赖本地文件挂载
# 使用前必须先创建这个 ConfigMap:
#   kubectl create configmap stickman-schema -n stickman \
#       --from-file=schema.sql=db/schema.sql
apiVersion: v1
kind: ConfigMap
metadata:
  name: stickman-schema-placeholder
  namespace: stickman
data:
  note: |
    上方 ConfigMap 是占位说明,实际 stickman-schema 由命令创建:
      kubectl create configmap stickman-schema -n stickman \
        --from-file=schema.sql=db/schema.sql
